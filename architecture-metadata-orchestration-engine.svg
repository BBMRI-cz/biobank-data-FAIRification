<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 750" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="ar-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1971c2"/>
    </marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2b8a3e"/>
    </marker>
    <marker id="ar-o" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d9480f"/>
    </marker>
  </defs>

  <!-- LOKÁLNA ZÓNA -->
  <rect x="10" y="10" width="1000" height="580" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="25" y="30" font-size="13" font-weight="700" fill="#495057">🔒 LOCAL BIOBANK INFRASTRUCTURE (On-Premises / Hospital Firewall)</text>

  <!-- DATA SOURCES -->
  <!-- HIS / EHR -->
  <rect x="25" y="45" width="150" height="48" rx="6" fill="#ffe3e3" stroke="#ffa8a8" stroke-width="1.5"/>
  <text x="35" y="65" font-size="14" font-weight="700" fill="#c92a2a">HIS / EHR</text>
  <text x="35" y="82" font-size="12" fill="#a61e4d">Clinical data</text>

  <!-- PACS -->
  <rect x="25" y="100" width="150" height="48" rx="6" fill="#d3f9d8" stroke="#8ce99a" stroke-width="1.5"/>
  <text x="35" y="120" font-size="14" font-weight="700" fill="#2b8a3e">PACS</text>
  <text x="35" y="137" font-size="12" fill="#2f9e44">Radiology (CT/MRI)</text>

  <!-- File System -->
  <rect x="25" y="155" width="150" height="48" rx="6" fill="#ffe8cc" stroke="#ffd8a8" stroke-width="1.5"/>
  <text x="35" y="175" font-size="14" font-weight="700" fill="#d9480f">File System</text>
  <text x="35" y="192" font-size="12" fill="#e8590c">Genomics (Seq)</text>

  <!-- WSI Storage -->
  <rect x="25" y="210" width="150" height="48" rx="6" fill="#fff9db" stroke="#ffe066" stroke-width="1.5"/>
  <text x="35" y="230" font-size="14" font-weight="700" fill="#f08c00">WSI Storage</text>
  <text x="35" y="247" font-size="12" fill="#e67700">Pathology images</text>

  <!-- Šípka k Declarative Config -->
  <line x1="175" y1="150" x2="200" y2="150" stroke="#868e96" stroke-width="2" marker-end="url(#ar-b)"/>

  <!-- DECLARATIVE CONFIG -->
  <rect x="205" y="80" width="155" height="140" rx="6" fill="#ffffff" stroke="#1971c2" stroke-width="1.8"/>
  <rect x="205" y="80" width="155" height="26" rx="6" fill="#1971c2"/>
  <text x="215" y="98" font-size="12" font-weight="700" fill="#ffffff">⚙️ Declarative Config</text>
  <text x="215" y="123" font-size="12" font-weight="600" fill="#212529">• Storage paths</text>
  <text x="215" y="145" font-size="12" font-weight="600" fill="#212529">• Identifiers</text>
  <text x="215" y="167" font-size="12" font-weight="600" fill="#212529">• Credentials</text>
  <text x="215" y="189" font-size="12" font-weight="600" fill="#212529">• Biobank metadata</text>

  <line x1="360" y1="150" x2="385" y2="150" stroke="#1971c2" stroke-width="2.5" marker-end="url(#ar-b)"/>

  <!-- DOCKER ENGINE -->
  <rect x="390" y="42" width="605" height="535" rx="8" fill="#e7f5ff" stroke="#339af0" stroke-width="2"/>
  <rect x="390" y="42" width="370" height="26" rx="6" fill="#339af0"/>
  <text x="405" y="60" font-size="13" font-weight="700" fill="#ffffff">📦 Docker Package: Metadata Orchestration Engine</text>

  <!-- Krok 1 -->
  <rect x="408" y="76" width="460" height="48" rx="5" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="420" y="96" font-size="14" font-weight="700" fill="#1971c2">1. Metadata Ingestion</text>
  <text x="420" y="113" font-size="12" fill="#495057">Connects to local data sources containing raw metadata</text>
  <line x1="638" y1="124" x2="638" y2="134" stroke="#1971c2" stroke-width="2" marker-end="url(#ar-b)"/>

  <!-- Krok 2 -->
  <rect x="408" y="136" width="460" height="48" rx="5" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="420" y="156" font-size="14" font-weight="700" fill="#1971c2">2. AI-Driven Attribute Extraction</text>
  <text x="420" y="173" font-size="12" fill="#495057">LLM scans raw source metadata to identify and extract attributes</text>
  <line x1="638" y1="184" x2="638" y2="194" stroke="#1971c2" stroke-width="2" marker-end="url(#ar-b)"/>

  <!-- Krok 3 -->
  <rect x="408" y="196" width="460" height="58" rx="5" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="420" y="215" font-size="14" font-weight="700" fill="#1971c2">3. Source-Specific Metadata APIs / Internal DBs</text>
  <text x="420" y="231" font-size="11.5" fill="#495057">Stores extracted intermediate metadata into modular APIs/databases</text>
  <text x="420" y="246" font-size="11.5" font-weight="600" fill="#212529">[ Clinical API ]  [ Radio API ]  [ Seq API ]  [ WSI API ]</text>
  <line x1="638" y1="254" x2="638" y2="264" stroke="#1971c2" stroke-width="2" marker-end="url(#ar-b)"/>

  <!-- Krok 4 -->
  <rect x="408" y="266" width="460" height="60" rx="5" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="420" y="286" font-size="14" font-weight="700" fill="#1971c2">4. AI-Driven Semantic Normalisation &amp; Ontology Mapping</text>
  <text x="420" y="303" font-size="12" fill="#495057">LLM normalises dialects/shorthand to standards (MIABIS, NCIT, SNOMED)</text>
  <line x1="638" y1="326" x2="638" y2="336" stroke="#1971c2" stroke-width="2" marker-end="url(#ar-b)"/>

  <!-- Krok 5 -->
  <rect x="408" y="338" width="460" height="48" rx="5" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="420" y="358" font-size="14" font-weight="700" fill="#1971c2">5. Patient Record Aggregation</text>
  <text x="420" y="375" font-size="12" fill="#495057">Cross-source identity resolution to merge multimodal records</text>
  <line x1="638" y1="386" x2="638" y2="396" stroke="#1971c2" stroke-width="2" marker-end="url(#ar-b)"/>

  <!-- Krok 6 -->
  <rect x="408" y="398" width="460" height="48" rx="5" fill="#ffffff" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="420" y="418" font-size="14" font-weight="700" fill="#1971c2">6. Patient Record Pseudonymisation</text>
  <text x="420" y="435" font-size="12" fill="#495057">Assigns pseudo-identifiers per record across metadata modules</text>
  <line x1="638" y1="446" x2="638" y2="460" stroke="#1971c2" stroke-width="2" marker-end="url(#ar-b)"/>

  <!-- Krok 7 Export -->
  <rect x="430" y="462" width="416" height="38" rx="5" fill="#d3f9d8" stroke="#51cf66" stroke-width="1.6"/>
  <text x="445" y="486" font-size="13" font-weight="700" fill="#2b8a3e">✓ Export: Harmonised &amp; Anonymised Metadata Record</text>

  <!-- Väzba zo schémy do AI -->
  <path d="M 920 620 L 920 296 L 870 296" fill="none" stroke="#d9480f" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar-o)"/>
  <path d="M 920 296 L 920 160 L 870 160" fill="none" stroke="#d9480f" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#ar-o)"/>
  <rect x="880" y="215" width="82" height="22" rx="4" fill="#fff4e6" stroke="#ffd8a8" stroke-width="1"/>
  <text x="886" y="230" font-size="11" font-weight="700" fill="#d9480f">guides schema</text>

  <!-- Export dole do Katalógu -->
  <path d="M 638 500 L 638 620" fill="none" stroke="#2b8a3e" stroke-width="3" marker-end="url(#ar-g)"/>
  <rect x="648" y="540" width="130" height="24" rx="4" fill="#ebfbee" stroke="#b2f2bb" stroke-width="1"/>
  <text x="655" y="556" font-size="12" font-weight="700" fill="#2b8a3e">publishes metadata</text>

  <!-- CENTRÁLNA ZÓNA -->
  <text x="10" y="612" font-size="13" font-weight="700" fill="#495057">☁️ CENTRAL DISCOVERY LAYER</text>

  <!-- Katalóg -->
  <rect x="330" y="626" width="365" height="110" rx="8" fill="#f4fce3" stroke="#74b816" stroke-width="2"/>
  <text x="345" y="652" font-size="15" font-weight="700" fill="#2b8a3e">🌐 data.bbmri.cz Metadata Catalogue</text>
  <line x1="345" y1="662" x2="685" y2="662" stroke="#d8f5a2" stroke-width="1.2"/>
  <text x="345" y="684" font-size="13" fill="#2f9e44">• Cohort discovery query engine</text>
  <text x="345" y="706" font-size="13" fill="#2f9e44">• Cross-modal search (Clinical + NGS + Radio + WSI)</text>

  <!-- BBDIMS Schéma -->
  <rect x="705" y="626" width="305" height="110" rx="8" fill="#fff4e6" stroke="#fd7e14" stroke-width="2"/>
  <text x="720" y="648" font-size="15" font-weight="700" fill="#d9480f">📑 BBDIMS</text>
  <text x="720" y="663" font-size="10" font-weight="600" fill="#a61e4d">(Biobank Biosample and Data Integration</text>
  <text x="720" y="675" font-size="10" font-weight="600" fill="#a61e4d"> Metadata Schema)</text>
  <line x1="720" y1="681" x2="995" y2="681" stroke="#ffe8cc" stroke-width="1.2"/>
  <text x="720" y="700" font-size="12" fill="#d9480f">• Ontologies: MIABIS, NCIT, SNOMED CT</text>
  <text x="720" y="720" font-size="12" fill="#d9480f">• Clinical, Radio, WSI, Seq data</text>
</svg>
